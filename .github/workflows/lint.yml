name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# actions/checkout runs `git init` before it fetches our ref, and a fresh repo defaults to `master`, so git prints a
# hint about that default changing in Git 3.0. Setting it through env quiets the hint without a step before checkout.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  types:
    runs-on: ubuntu-latest
    env:
      # The schema loads sanity/env.ts, which needs these set. Any value works for extracting types.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Generates the Sanity types first (pretypecheck), then runs tsc.
      - run: npm run typecheck

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check

  knip:
    runs-on: ubuntu-latest
    env:
      # The schema loads sanity/env.ts, which needs these set. Any value works for extracting types.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # sanity.types.ts is generated and gitignored; without it knip reports every import of it as unresolved.
      - run: npm run typegen
      - run: npm run knip
