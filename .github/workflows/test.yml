name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Fork and Dependabot PRs don't get repository secrets, so there is no Sanity token to test with.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    # The mutex step keeps its lock on a branch, so it needs to push.
    permissions:
      contents: write
      actions: read
      packages: read
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      # Never anything but `dev`: the tests submit forms, and the teardown deletes what they created.
      NEXT_PUBLIC_SANITY_DATASET: dev
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # A cached browser still needs the system libraries.
      - name: Install system libraries
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # The suite creates its own content in (and removes it from) the shared `dev` dataset, so only one run at a time.
      # A `concurrency` group can't do this: it keeps one waiting run and cancels the rest, which failed the checks of
      # PRs that landed together. This lock makes every run wait its turn, and releases it when the job ends.
      - name: Wait for the dev dataset
        uses: ben-z/gh-action-mutex@1ebad517141198e08d47cf72f3c0975316620a65 # v1.0.0-alpha.10
        with:
          branch: gh-mutex-e2e-dev-dataset
      # Playwright's web server command seeds the test content, builds the site (prebuild runs typegen) and starts it.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
