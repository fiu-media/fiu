name: CodeQL

# Replaces CodeQL's default setup, which creates no run (so no `Analyze (...)` check) for PRs that
# only touch files it doesn't analyze, such as Dependabot's package.json bumps. Branch protection
# requires those checks, so those PRs were blocked forever. Here the jobs run on every PR.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# actions/checkout runs `git init` before it fetches our ref, and a fresh repo defaults to `master`, so git prints a
# hint about that default changing in Git 3.0. Setting it through env quiets the hint without a step before checkout.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analyze:
    # Keep this name: branch protection requires `Analyze (javascript-typescript)` and
    # `Analyze (python)`. Don't skip the job itself with `if:`, a skipped matrix job never
    # reports under these names.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    # Dependabot's token is read-only, so it can't upload results. Its PRs only change manifests
    # and workflow pins, which dependency-review covers, so the steps are skipped and the job
    # still reports success.
    env:
      SKIP: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'
      # The runner's system Python has no lib-dynload on its path, which makes the Python extractor log
      # `[WARN] Failed to find dynload path`. A regular CPython build has it.
      - uses: actions/setup-python@v7
        if: env.SKIP != 'true' && matrix.language == 'python'
        with:
          python-version: "3.x"
      - uses: github/codeql-action/init@v4
        if: env.SKIP != 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        if: env.SKIP != 'true'
        with:
          category: /language:${{ matrix.language }}
