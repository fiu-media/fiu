name: Dependency review

on:
  pull_request:

permissions:
  contents: read

# actions/checkout runs `git init` before it fetches our ref, and a fresh repo defaults to `master`, so git prints a
# hint about that default changing in Git 3.0. Setting it through env quiets the hint without a step before checkout.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # picomatch ReDoS: every release up to the latest (4.0.7) is affected and none is patched yet. It only comes
          # in through dev tooling (chokidar, vite, vitest, knip). Remove once a fixed picomatch is published.
          allow-ghsas: GHSA-fc5q-39xc-vjpf
